- project:
    templates:
      - openstack-cover-jobs
      - openstack-python3-jobs
      - publish-openstack-docs-pti
      - check-requirements
    check:
      jobs:
        - heat-translator-tox-py311-tp:
            voting: false

- job:
    name: heat-translator-tox-py311-tp
    parent: openstack-tox-py311
    description: |
      Run tests for heat-translator project.

      Uses tox with the ``py311-tp`` environment.
    vars:
      tox_envlist: py311-tp
