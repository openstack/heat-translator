- project:
    templates:
      - openstack-cover-jobs
      - openstack-python3-jobs
      - openstack-python3-next-jobs
      - publish-openstack-docs-pti
      - check-requirements
    check:
      jobs:
        - heat-translator-tox-py311-tips:
            voting: false

- job:
    name: heat-translator-tox-py311-tips
    parent: openstack-tox-py311
    description: |
      Run tests for heat-translator project with the latest tosca-parser
    vars:
      tox_envlist: py311
    required-projects:
      - name: openstack/tosca-parser
